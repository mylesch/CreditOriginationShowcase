services:
  bureau-mocks:
    build:
      context: ./cos-platform
      dockerfile: Dockerfile
      target: bureau-mocks
    ports:
      - "9561:9561"

  decision-service:
    build:
      context: ./cos-platform
      dockerfile: Dockerfile
      target: decision-service
    ports:
      - "8081:8081"

  orchestration:
    build:
      context: ./cos-platform
      dockerfile: Dockerfile
      target: orchestration
    ports:
      - "8082:8082"
    depends_on:
      - bureau-mocks
      - decision-service
    command:
      - "--cos.orchestration.drs.base-url=http://decision-service:8081"
      - "--cos.orchestration.bureaus.northgate.base-url=http://bureau-mocks:9561"
      - "--cos.orchestration.bureaus.meridian.base-url=http://bureau-mocks:9561"
      - "--cos.orchestration.bureaus.sentinel.base-url=http://bureau-mocks:9561"
      - "--cos.orchestration.bureaus.clearbank.base-url=http://bureau-mocks:9561"
